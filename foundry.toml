[profile.default]
src = "src"
out = "out"
libs = ["lib"]

# Both pinned exactly, never left to the toolchain's defaults: these lines decide the deployed bytecode,
# and the contracts are not upgradeable.
#
# `evm_version` deliberately trails the compiler's own default. Nothing in these contracts needs anything
# past Cancun, and the older target keeps the same source deployable on chains that have not reached the
# newest fork.
#
# viaIR stays disabled: the private helpers splitting the channels' `mint` exist to make it unnecessary.
solc = "0.8.36"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
# The remappings are written into every contract's metadata, so they decide the bytecode too. Only
# remappings.txt counts: auto-detection would add entries from whichever nested submodules are checked
# out under lib/.
auto_detect_remappings = false

[lint]
# Every `block.timestamp` comparison here is a signature expiry (up to 14 days) or a rate-limit window (at
# least a day). Both track wall-clock time, and the few seconds a validator can shift the timestamp by are
# immaterial at those scales.
exclude_lints = ["block-timestamp"]
